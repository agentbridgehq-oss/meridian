name: Meridian Tests

# Intentionally manual-only while Meridian 2.0 is being hardened.
# No push, pull_request, schedule, or repository event can start this workflow.
# Use Actions -> Meridian Tests -> Run workflow only when a deliberate CI check is wanted.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:agency
