name: Meridian Tests

on:
  push:
    branches:
      - meridian-agency-2-0
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: meridian-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:agency
