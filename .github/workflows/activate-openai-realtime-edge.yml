name: Activate OpenAI Realtime Edge

on:
  push:
    branches:
      - meridian-agency-2-0
    paths:
      - '.github/workflows/activate-openai-realtime-edge.yml'
      - 'scripts/activate-openai-realtime-edge.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meridian-agency-2-0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply guarded source migration
        run: node scripts/activate-openai-realtime-edge.mjs
      - name: Regenerate lockfile with official OpenAI SDK
        run: npm install --ignore-scripts
      - name: Run Meridian test suite
        run: npm run test:agency
      - name: Commit migration if changed
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.mjs package.json package-lock.json tests/server-openai-webhook-order.test.mjs
          git commit -m 'Activate OpenAI Realtime provider edge'
          git push origin HEAD:meridian-agency-2-0
