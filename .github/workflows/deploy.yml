name: Deploy to Railway

# Deploys Meridian to Railway on master/main push, plus manual dispatch.
# After railway up is accepted, probe PUBLIC_BASE_URL / STAGING_URL /healthz
# so a dead domain fails the job instead of looking successful.

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set — see .github/workflows/README.md"
            exit 1
          fi
          railway up --detach --ci

      - name: Probe public health
        env:
          PUBLIC_BASE_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$PUBLIC_BASE_URL" ]; then
            echo "STAGING_URL secret not set — skipping live probe. Add it after the Railway domain exists."
            exit 0
          fi
          npm ci
          node scripts/go-live.mjs --url "$PUBLIC_BASE_URL"
